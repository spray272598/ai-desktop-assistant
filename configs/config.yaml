server:
  host: "0.0.0.0"
  port: 8080
  mode: "debug"

agent:
  name: "AI Desktop Assistant"
  version: "1.1.0"
  max_steps: 15
  timeout: 120
  token_budget: 16000

llm:
  provider: "siliconflow"
  model: "deepseek-ai/DeepSeek-V3"
  api_key: ""
  api_base: "https://api.siliconflow.cn/v1"
  use_mock: false
  models:
    fast:
      model: "deepseek-ai/DeepSeek-V3"
      weight: 2
      scenarios: ["chat", "file", "command", "browser"]
    strong:
      model: "deepseek-ai/DeepSeek-V3"
      weight: 1
      scenarios: ["complex", "code"]
    default:
      model: "deepseek-ai/DeepSeek-V3"
      weight: 1
      scenarios: ["chat"]

desktop:
  workspace: "./workspace"
  temp_dir: "./temp"
  screenshot_dir: "./screenshots"

database:
  type: "mysql"
  auto_migrate: true
  schema_path: "docs/dev-ops/mysql/sql/01_schema.sql"
  mysql:
    host: "127.0.0.1"
    port: 3306
    database: "ai_desktop_assistant"
    username: "root"
    password: "123456"

redis:
  enabled: false
  host: "127.0.0.1"
  port: 6379
  password: ""
  db: 0

rate_limit:
  enabled: true
  per_minute: 60

sandbox:
  enabled: true
  use_docker: true
  work_dir: "./temp/sandbox"

logging:
  level: "info"
  file: "logs/assistant.log"

tools:
  file:
    enabled: true
    base_dir: "./workspace"
  command:
    enabled: true
    max_timeout: 60
    deny_list:
      - "(?i)\\brm\\s+-rf?\\s+/?(\\s|$)"
      - "(?i)\\b(shutdown|reboot)\\b"
      - "(?i)\\bformat\\b"
  screenshot:
    enabled: true
    save_dir: "./screenshots"
  browser:
    enabled: true
  sandbox:
    enabled: true

mcp:
  enabled: true
  servers:
    - name: demo
      transport: stdio
      command: ""
      timeout_sec: 30
      enabled: true

# Skill 工作流（SKILL.md）；工具能力外置 MCP，流程规范走 Skill
skills:
  enabled: true
  dir: "./skills"
